name: Install NASA lunar surface maps
on:
  push:
    branches: [main]
    paths:
      - scripts/fetch_nasa_moon.py
      - .github/workflows/install-nasa-moon.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nasa-moon-vendor
  cancel-in-progress: false
jobs:
  vendor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - run: python scripts/fetch_nasa_moon.py
      - name: Commit verified NASA imagery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/moon/*.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'assets: add public-domain NASA LRO lunar color and elevation'
          git pull --rebase origin main
          git push origin HEAD:main
