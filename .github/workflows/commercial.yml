name: Lazarus Commercial - source and responsive browser QA
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/commercial-*.mjs'
      - 'storybook/assets/entrance/**'
      - 'storybook/assets/characters/paperkeeper.front.webp'
      - '.github/workflows/commercial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/commercial-smoke.mjs
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Serve actual GitHub Pages source
        run: |
          mkdir -p /tmp/lazarus-commercial
          ln -s "$GITHUB_WORKSPACE" /tmp/lazarus-commercial/lazarusdev
          python3 -m http.server 4186 --bind 127.0.0.1 --directory /tmp/lazarus-commercial >/tmp/lazarus-commercial.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4186/lazarusdev/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: node scripts/commercial-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commercial-browser-evidence
          path: artifacts/commercial
          if-no-files-found: warn
