name: Install verified CC0 bust
on:
  push:
    branches: [main]
    paths:
      - scripts/fetch_cc0_bust.py
      - .github/workflows/install-cc0-asset.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: marble-bust-install
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and validate GLB
        run: python scripts/fetch_cc0_bust.py
      - name: Commit only the verified asset
        run: |
          if git ls-files --error-unmatch assets/models/marble_bust_01.glb >/dev/null 2>&1; then
            echo "Asset already tracked"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/models/marble_bust_01.glb
          git commit -m 'assets: vendor verified CC0 Poly Haven marble bust GLB'
          git pull --rebase origin main
          git push origin HEAD:main
