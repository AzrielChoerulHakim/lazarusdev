name: Forest Stage 17 — Editorial reconstruction and native atlas QA (no screenshots)
on:
  push:
    branches: [main, feature/forest-storybook]
    paths:
      - index.html
      - storybook/index.html
      - src/storybook/styles/editorial-reconstruction.css
      - scripts/forest_editorial_smoke.mjs
      - .github/workflows/forest-editorial.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editorial:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and dual-route builds
        run: |
          node --check scripts/forest_editorial_smoke.mjs
          npm install --no-audit --no-fund
          npm run build
          npm run build:storybook
      - name: Install Chrome browser QA
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          google-chrome --version
      - name: Keyboard fold, chapter maps, authentic case, desktop and mobile, no-JS and reduced motion — no screenshots
        run: |
          mkdir -p /tmp/stage17-mirror/lazarusdev reports
          cp -a dist/. /tmp/stage17-mirror/lazarusdev/
          cp -a dist-storybook/. /tmp/stage17-mirror/lazarusdev/
          python3 -m http.server 4186 --bind 127.0.0.1 --directory /tmp/stage17-mirror > /tmp/stage17-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4186/lazarusdev/ > /dev/null; then break; fi
            sleep 2
          done
          node scripts/forest_editorial_smoke.mjs | tee reports/stage17-browser-qa.log
      - name: Publish text logs only — never screenshots or videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forest-stage17-editorial-text-qa
          path: reports/stage17-browser-qa.log
          if-no-files-found: ignore
