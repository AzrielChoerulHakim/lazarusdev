name: Build and browser verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check src/main.js
          node --check src/world.js
          node --check src/sculpture.js
          node --check src/fractureGeometry.js
          node --check src/environment.js
          node --check src/stoneMaterials.js
          node --check src/portalFx.js
          node --check scripts/smoke.mjs
          node --check scripts/pages-smoke.mjs
          node --check src/photographicSky.js
          node --check src/lunarSurface.js
          node --check src/architecturalDetails.js
          node --check src/cloth.js
          node --check src/atmosphericParticles.js
      - name: Production build
        run: npm run build
      - name: Install browser harness
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise WebGL and responsive UI
        run: |
          npm run dev -- --port 4173 --strictPort > /tmp/lazarus-vite.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 2
          done
          node scripts/smoke.mjs
      - name: Validate GitHub Pages without Vite bundling
        run: |
          mkdir -p /tmp/lazarus-pages
          ln -s "$GITHUB_WORKSPACE" /tmp/lazarus-pages/lazarusdev
          python3 -m http.server 4174 --bind 127.0.0.1 -d /tmp/lazarus-pages > /tmp/lazarus-pages.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4174/lazarusdev/ >/dev/null; then break; fi
            sleep 2
          done
          node scripts/pages-smoke.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webgl-smoke-screenshots
          path: screenshots/
          if-no-files-found: ignore
