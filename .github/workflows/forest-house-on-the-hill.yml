name: Forest Stage 10 — House on the Hill artwork and local inquiry QA
on:
  push:
    branches: [main, feature/forest-storybook]
    paths:
      - index.html
      - storybook/index.html
      - src/storybook/house-on-the-hill.js
      - src/storybook/styles/house-on-the-hill.css
      - scripts/forest_house_audit.py
      - scripts/forest_house_smoke.mjs
      - storybook/assets/house-on-the-hill/**
      - .github/workflows/forest-house-on-the-hill.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  house-on-the-hill:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit image provenance, source/exports, semantic content and honest local-only brief
        run: |
          python3 -m venv /tmp/forest-stage10-venv
          /tmp/forest-stage10-venv/bin/pip install 'Pillow>=10,<13'
          /tmp/forest-stage10-venv/bin/python scripts/forest_house_audit.py
      - name: Validate source modules and compile both GitHub Pages routes
        run: |
          node --check src/storybook/house-on-the-hill.js
          node --check scripts/forest_house_smoke.mjs
          npm install --no-audit --no-fund
          npm run build
          npm run build:storybook
      - name: Install browser QA engine
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          google-chrome --version
      - name: Eight viewports on two routes, light toggle, keyboard, local brief, no JS — zero screenshots
        run: |
          mkdir -p /tmp/stage10-mirror/lazarusdev reports
          cp -a dist/. /tmp/stage10-mirror/lazarusdev/
          cp -a dist-storybook/. /tmp/stage10-mirror/lazarusdev/
          python3 -m http.server 4186 --bind 127.0.0.1 --directory /tmp/stage10-mirror > /tmp/stage10-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4186/lazarusdev/ > /dev/null; then break; fi
            sleep 2
          done
          node scripts/forest_house_smoke.mjs | tee reports/stage10-browser-qa.log
      - name: Upload metadata and text logs only — never screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forest-stage10-house-text-qa
          path: |
            storybook/assets/house-on-the-hill/manifest.json
            reports/stage10-browser-qa.log
          if-no-files-found: ignore
