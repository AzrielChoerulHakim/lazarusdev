name: Forest Stage 18 — Public launch, canonical metadata and release QA (no screenshots)
on:
  push:
    branches: [main, feature/forest-storybook]
    paths:
      - index.html
      - storybook/index.html
      - README.md
      - public/sitemap.xml
      - scripts/forest_launch_smoke.mjs
      - .github/workflows/forest-launch.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build canonical and nested GitHub Pages routes, validate smoke
        run: |
          node --check scripts/forest_launch_smoke.mjs
          npm install --no-audit --no-fund
          npm run build
          npm run build:storybook
          test -s dist/sitemap.xml
          test -s dist-storybook/sitemap.xml
      - name: Install Chrome browser QA
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          google-chrome --version
      - name: Confirm robots and canonicals, real share media, sitemap, navigation and no-JS — zero screenshots
        run: |
          mkdir -p /tmp/stage18-mirror/lazarusdev reports
          cp -a dist/. /tmp/stage18-mirror/lazarusdev/
          cp -a dist-storybook/. /tmp/stage18-mirror/lazarusdev/
          python3 -m http.server 4186 --bind 127.0.0.1 --directory /tmp/stage18-mirror > /tmp/stage18-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4186/lazarusdev/ >/dev/null; then break; fi
            sleep 2
          done
          set -o pipefail
          node scripts/forest_launch_smoke.mjs | tee reports/stage18-browser-qa.log
      - name: Upload text-only release evidence, never screenshots or recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forest-stage18-launch-text-qa
          path: reports/stage18-browser-qa.log
          if-no-files-found: ignore
