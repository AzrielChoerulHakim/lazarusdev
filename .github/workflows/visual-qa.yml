name: Visual QA snapshots
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/visual-qa.yml
      - scripts/visual-review.mjs
      - src/world.js
      - src/main.js
      - src/photographicSky.js
      - src/styles.css
      - src/sculpture.js
      - src/fractureGeometry.js
      - src/environment.js
      - src/stoneMaterials.js
      - src/portalFx.js
      - src/lunarSurface.js
      - src/architecturalDetails.js
      - src/cloth.js
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Install browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render real WebGL scene
        run: |
          npm run dev -- --port 4173 --strictPort >/tmp/vite-visual.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 2
          done
          node scripts/visual-review.mjs
      - name: Encode image previews for visual inspection
        run: |
          for scene in hero-desktop passage-desktop worlds-desktop hero-mobile passage-mobile; do
            base64 -w0 "docs/qa/${scene}.jpg" > "docs/qa/${scene}.b64.txt"
          done
      - name: Publish visual review images to isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/qa/*.jpg docs/qa/*.b64.txt
          git commit -m 'qa: capture actual WebGL scene on desktop and mobile'
          short_sha=${GITHUB_SHA:0:10}
          git push origin HEAD:refs/heads/visual-qa-${short_sha}
          echo "Visual review branch: visual-qa-${short_sha}"
