name: Forest Foundation — build and browser verification

on:
  push:
    branches:
      - main
      - feature/forest-storybook
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forest-foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Reject legacy 3D build artifacts
        run: |
          test ! -f src/world.js
          test ! -f src/sculpture.js
          test ! -d assets
          test ! -f scripts/smoke.mjs
          test ! -e public/favicon.svg
          ! grep -q '"three"' package.json
      - name: Build new root website
        run: npm run build
      - name: Build secondary storybook preview
        run: npm run build:storybook
      - name: Install browser harness
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          google-chrome --version
      - name: Verify production-shaped subpath and live root experience
        run: |
          mkdir -p /tmp/forest-mirror/lazarusdev
          cp -a dist/. /tmp/forest-mirror/lazarusdev/
          cp -a dist-storybook/. /tmp/forest-mirror/lazarusdev/
          python3 -m http.server 4186 --bind 127.0.0.1 --directory /tmp/forest-mirror > /tmp/forest-mirror.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4186/lazarusdev/ > /dev/null; then break; fi
            sleep 2
          done
          STORYBOOK_PREVIEW_URL=http://127.0.0.1:4186/lazarusdev/ node scripts/storybook-smoke.mjs
          node scripts/storybook-smoke.mjs
      - name: Upload verified page and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forest-main-foundation
          path: |
            dist/
            dist-storybook/
            screenshots/storybook/
          if-no-files-found: ignore
