name: Install CC0 photographic sky
on:
  push:
    branches: [main]
    paths:
      - scripts/fetch_sky_hdri.py
      - .github/workflows/install-sky-hdri.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cc0-photographic-sky
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Download and verify Poly Haven photographic sky
        run: python scripts/fetch_sky_hdri.py
      - name: Commit CC0 sky assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/hdris/*.hdr assets/hdris/*.jpg
          if git diff --cached --quiet; then echo "Sky already current"; exit 0; fi
          git commit -m 'assets: vendor CC0 photographic sky and sunset HDR lighting'
          git pull --rebase origin main
          git push origin HEAD:main
