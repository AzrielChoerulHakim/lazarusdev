name: Forest Stage 12 — Scene seams, native navigation and motion QA
on:
  push:
    branches: [main, feature/forest-storybook]
    paths:
      - index.html
      - storybook/index.html
      - src/storybook/forest-seams.js
      - src/storybook/styles/forest-seams.css
      - scripts/forest_scene_transitions_audit.py
      - scripts/forest_scene_transitions_smoke.mjs
      - .github/workflows/forest-scene-transitions.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scene-seams:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Five chapter/ four seam semantic audit
        run: python3 scripts/forest_scene_transitions_audit.py
      - name: Validate scripts and build both paths
        run: |
          node --check src/storybook/forest-seams.js
          node --check scripts/forest_scene_transitions_smoke.mjs
          npm install --no-audit --no-fund
          npm run build
          npm run build:storybook
      - name: Install browser QA
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          google-chrome --version
      - name: Browser QA 8 sizes x 2 routes, ink, navigation and fallbacks — no screenshot capture
        run: |
          set -o pipefail
          mkdir -p /tmp/forest-stage12-mirror/lazarusdev reports
          cp -a dist/. /tmp/forest-stage12-mirror/lazarusdev/
          cp -a dist-storybook/. /tmp/forest-stage12-mirror/lazarusdev/
          python3 -m http.server 4186 --bind 127.0.0.1 --directory /tmp/forest-stage12-mirror > /tmp/forest-stage12-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4186/lazarusdev/ > /dev/null; then break; fi
            sleep 2
          done
          node scripts/forest_scene_transitions_smoke.mjs | tee reports/forest-stage12-browser-qa.log
      - name: Upload text-only diagnostics; no screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forest-stage12-text-only
          path: reports/forest-stage12-browser-qa.log
          if-no-files-found: ignore
