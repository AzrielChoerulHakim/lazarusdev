name: Forest Stage 03 — semantic UI and responsive audit

on:
  push:
    branches:
      - main
      - feature/forest-storybook
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forest-storybook:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Reject legacy 3D source and check JS
        run: |
          test ! -f src/world.js
          test ! -f src/sculpture.js
          test ! -d assets
          test ! -f scripts/smoke.mjs
          ! grep -q '"three"' package.json
          node --check src/storybook/main.js
          node --check src/storybook/data/content.js
          node --check scripts/storybook-smoke.mjs
      - name: Build both GitHub Pages routes
        run: |
          npm run build
          npm run build:storybook
      - name: Browser harness
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          google-chrome --version
      - name: Real browser audit, 8 viewports x 2 routes
        run: |
          mkdir -p /tmp/forest-mirror/lazarusdev
          cp -a dist/. /tmp/forest-mirror/lazarusdev/
          cp -a dist-storybook/. /tmp/forest-mirror/lazarusdev/
          python3 -m http.server 4186 --bind 127.0.0.1 --directory /tmp/forest-mirror > /tmp/forest-mirror.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4186/lazarusdev/ > /dev/null; then break; fi
            sleep 2
          done
          node scripts/storybook-smoke.mjs
      - name: Upload build artifacts without screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forest-stage03-interface-audit
          path: |
            dist/
            dist-storybook/
          if-no-files-found: ignore
