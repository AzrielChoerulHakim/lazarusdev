name: Forest Stage 06 — Entrance hero / responsive visual QA
on:
  push:
    branches: [main, feature/forest-storybook]
    paths:
      - index.html
      - storybook/index.html
      - src/storybook/styles/entrance.css
      - scripts/forest_entrance_export.py
      - scripts/forest_entrance_audit.py
      - scripts/forest_entrance_smoke.mjs
      - storybook/assets/entrance/**
      - .github/workflows/forest-entrance.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  entrance-art-and-site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify illustration source bytes, provenance, alpha, and semantic HTML
        run: |
          python3 -m venv /tmp/forest-entrance-env
          /tmp/forest-entrance-env/bin/pip install 'Pillow>=10,<13'
          /tmp/forest-entrance-env/bin/python scripts/forest_entrance_audit.py
      - name: Validate scripts, build both routes
        run: |
          node --check src/storybook/main.js
          node --check scripts/forest_entrance_smoke.mjs
          npm install --no-audit --no-fund
          npm run build
          npm run build:storybook
      - name: Install browser QA
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          google-chrome --version
      - name: Test real compiled Pages-style routes in eight viewports
        run: |
          mkdir -p /tmp/forest-stage06-mirror/lazarusdev
          cp -a dist/. /tmp/forest-stage06-mirror/lazarusdev/
          cp -a dist-storybook/. /tmp/forest-stage06-mirror/lazarusdev/
          python3 -m http.server 4186 --bind 127.0.0.1 --directory /tmp/forest-stage06-mirror > /tmp/forest-entrance-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4186/lazarusdev/ > /dev/null; then break; fi
            sleep 2
          done
          node scripts/forest_entrance_smoke.mjs
      - name: Upload artwork and manifest (no screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forest-stage06-entrance-desktop-mobile-qa
          path: |
            storybook/assets/entrance/exports/
            storybook/assets/entrance/manifest.json
          if-no-files-found: ignore