name: Forest Stage 08 — Work Clearing illustrated folios and interaction QA
on:
  push:
    branches: [main, feature/forest-storybook]
    paths:
      - index.html
      - storybook/index.html
      - src/storybook/work-clearing.js
      - src/storybook/styles/work-clearing.css
      - scripts/forest_work_illustrations.py
      - scripts/forest_work_audit.py
      - scripts/forest_work_smoke.mjs
      - storybook/assets/work-clearing/**
      - .github/workflows/forest-work-clearing.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  work-clearing:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit source provenance, folios, hash identity, semantics and sizes
        run: |
          python3 -m venv /tmp/forest-stage08-venv
          /tmp/forest-stage08-venv/bin/pip install 'Pillow>=10,<13'
          /tmp/forest-stage08-venv/bin/python scripts/forest_work_audit.py
      - name: Check scripts and compile both GitHub Pages routes
        run: |
          node --check src/storybook/work-clearing.js
          node --check scripts/forest_work_smoke.mjs
          npm install --no-audit --no-fund
          npm run build
          npm run build:storybook
      - name: Install real-browser DOM test runner
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          google-chrome --version
      - name: Validate 8 viewports x 2 routes, native project links, keyboard, reduced motion, image/script fallback — no screenshots
        run: |
          mkdir -p /tmp/stage08-mirror/lazarusdev reports
          cp -a dist/. /tmp/stage08-mirror/lazarusdev/
          cp -a dist-storybook/. /tmp/stage08-mirror/lazarusdev/
          python3 -m http.server 4186 --bind 127.0.0.1 --directory /tmp/stage08-mirror > /tmp/stage08-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4186/lazarusdev/ > /dev/null; then break; fi
            sleep 2
          done
          node scripts/forest_work_smoke.mjs | tee reports/stage08-browser-qa.log
      - name: Upload QA text log and integrity manifest only; never screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forest-stage08-work-clearing-qa
          path: |
            storybook/assets/work-clearing/manifest.json
            reports/stage08-browser-qa.log
          if-no-files-found: ignore